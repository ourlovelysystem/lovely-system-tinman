AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tinman voice recorder and recording browser.

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref RecordingTable
        RECORDINGS_BUCKET: !Ref RecordingsBucket

Resources:
  # Preserved as historical evidence from the earlier Tinman increment.
  # The voice application does not read or write this table.
  TinmanTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  RecordingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  RecordingsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 300

  TinmanApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [content-type]
        AllowMethods: [GET, POST, OPTIONS]

  TinmanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref RecordingTable}
        - S3CrudPolicy: {BucketName: !Ref RecordingsBucket}
        - Statement:
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
              Resource: '*'
      Events:
        Health:
          Type: HttpApi
          Properties: {ApiId: !Ref TinmanApi, Path: /health, Method: GET}
        InitRecording:
          Type: HttpApi
          Properties: {ApiId: !Ref TinmanApi, Path: /recordings/init, Method: POST}
        CompleteRecording:
          Type: HttpApi
          Properties: {ApiId: !Ref TinmanApi, Path: /recordings/complete, Method: POST}
        ListRecordings:
          Type: HttpApi
          Properties: {ApiId: !Ref TinmanApi, Path: /recordings, Method: GET}
        InitResponse:
          Type: HttpApi
          Properties: {ApiId: !Ref TinmanApi, Path: /responses/init, Method: POST}
        CompleteResponse:
          Type: HttpApi
          Properties: {ApiId: !Ref TinmanApi, Path: /responses/complete, Method: POST}
        ListResponses:
          Type: HttpApi
          Properties: {ApiId: !Ref TinmanApi, Path: /responses, Method: GET}
        UnlockTranscript:
          Type: HttpApi
          Properties: {ApiId: !Ref TinmanApi, Path: /transcripts/unlock, Method: POST}
        GetTranscript:
          Type: HttpApi
          Properties: {ApiId: !Ref TinmanApi, Path: /transcripts, Method: GET}

Outputs:
  ApiUrl:
    Value: !Sub https://${TinmanApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
    Description: Place this URL in ../config.js.
  RecordingsBucketName:
    Value: !Ref RecordingsBucket
