<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tinman — Appeals</title><link rel="stylesheet" href="/styles.css"></head>
<body><main>
  <section class="panel common-meter" aria-labelledby="meterHeading">
    <h2 id="meterHeading" class="sr-only">Audiometer</h2>
    <div class="meter-channel"><div class="meter-head"><strong>Microphone</strong><span id="micMeterMode">Ready</span></div><canvas id="micVisualizer" aria-label="Live microphone level" role="img"></canvas></div>
    <section class="recorder" aria-labelledby="recordHeading">
    <h2 id="recordHeading">Record</h2>
    <div class="record-field"><label for="selfId">Public self-identification</label><input id="selfId" maxlength="80" autocomplete="nickname" placeholder="Name / public identity"></div>
    <div class="record-field"><label for="title">Title</label><input id="title" maxlength="120" placeholder="Optional title"></div>
    <div class="record-actions"><div class="controls"><button id="recordButton" class="primary">Record</button><button id="stopButton" disabled>Stop</button><button id="rewindButton" class="jump" disabled aria-label="Jump back 10 seconds" title="Jump back 10 seconds">↶</button><button id="playButton" disabled>Replay</button><button id="forwardButton" class="jump" disabled aria-label="Jump forward 10 seconds" title="Jump forward 10 seconds">↷</button></div><div class="time"><span id="recordingState">Ready</span><span id="elapsed">0:00</span></div></div>
    <audio id="preview" controls crossorigin="anonymous" hidden></audio>
    <div class="record-submit"><button id="submitButton" class="primary submit" disabled>Save recording</button><p id="notice" role="status" aria-live="polite"></p></div>
  </section>
      <div class="meter-channel"><div class="meter-head"><strong>Playback</strong><span id="playMeterMode">Ready</span></div><canvas id="playVisualizer" aria-label="Live playback level" role="img"></canvas></div>
  </section>
  
    <section class="panel search-strip" aria-label="Search recordings">
      <label>From<input id="searchFrom" type="datetime-local"></label>
      <label>To<input id="searchTo" type="datetime-local"></label>
      <label>Title<input id="searchTitle" type="search" placeholder="Any title"></label>
      <label>Author<input id="searchAuthor" type="search" placeholder="Any author"></label>
      <label>Responses ≥<input id="searchMinResponses" type="number" min="0" inputmode="numeric" placeholder="0"></label>
      <label>Responses ≤<input id="searchMaxResponses" type="number" min="0" inputmode="numeric" placeholder="Any"></label>
      <label>Transcript<select id="searchTranscript"><option value="any">Any</option><option value="present">Is not null</option><option value="null">Is null</option></select></label>
      <label>System speaker<select id="searchSpeaker"><option value="any">Any</option><option value="declared">Declared</option><option value="absent">Not declared</option></select></label>
      <label>Inquiry<select id="searchInquiry"><option value="any">Any</option><option value="present">Present</option><option value="absent">Absent</option></select></label>
      <label>Sensitive<select id="searchSensitive"><option value="any">Any</option><option value="present">Possible</option><option value="absent">Not detected</option></select></label>
      <button id="clearSearch" type="button">Clear</button>
      <output id="searchCount" aria-live="polite"></output>
    </section>

  <div class="scroll-workspace">
    <header><nav class="site-nav" aria-label="Tin Man"><a href="/about.html">About &amp; Architecture</a></nav><p class="eyebrow">TINMAN / OUR LOVELY SYSTEM</p><h1>Leave a voice message.</h1><p id="modeCopy">Record an appeal. Say what happened in your own voice.</p></header>
    <section class="panel browser" aria-labelledby="browseHeading"><div class="browserHead"><div><h2 id="browseHeading">Recording browser</h2><p>Newest first.</p></div><div class="browser-metrics" aria-label="Loaded message metrics"><span title="Among loaded messages"><strong id="zeroResponseMetric">—</strong> zero responses</span><span title="Fewer than three declared speakers among loaded messages"><strong id="insufficientAckMetric">—</strong> insufficiently acknowledged</span></div><button id="refreshButton">Refresh</button></div><div id="recordings"><p class="empty">Loading recordings…</p></div></section>
  </div>
</main><script src="/config.js"></script><script src="/app.js"></script></body></html>
