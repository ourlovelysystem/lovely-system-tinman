<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tinman — Messages</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Tin Man - <span>Where information asymmetry comes to die.</span></h1>
      <div class="challenge">
        <p>All messages and responses are public.</p>
        <p>Meus're asking for it.</p>
        <p class="provocation">So fuck you asshole!</p>
        <p class="question">What do you have to say?</p>
      </div>
    </header>

    <section class="panel common-meter" aria-labelledby="meterHeading">
      <div class="meter-head"><h2 id="meterHeading">Audiometer</h2><span id="meterMode">Ready</span></div>
      <canvas id="visualizer" aria-label="Shared live microphone level" role="img"></canvas>
    </section>
    <div class="meter-space" aria-hidden="true"></div>

    <section class="panel recorder" aria-labelledby="recordHeading">
      <h2 id="recordHeading">Record</h2>
      <label for="selfId">Public self-identification</label>
      <input id="selfId" maxlength="80" autocomplete="nickname" placeholder="How should this recording identify you?">
      <label for="title">Title</label>
      <input id="title" maxlength="120" placeholder="Optional recording title">
      <div class="controls">
        <button id="recordButton" class="primary">Record</button>
        <button id="stopButton" disabled>Stop</button>
        <button id="rewindButton" class="jump" disabled aria-label="Jump back 10 seconds" title="Jump back 10 seconds">↶</button>
        <button id="playButton" disabled>Replay</button>
        <button id="forwardButton" class="jump" disabled aria-label="Jump forward 10 seconds" title="Jump forward 10 seconds">↷</button>
      </div>
      <div class="time"><span id="recordingState">Ready</span><span id="elapsed">0:00</span></div>
      <audio id="preview" controls hidden></audio>
      <button id="submitButton" class="primary submit" disabled>Submit recording</button>
      <p id="notice" role="status" aria-live="polite"></p>
    </section>

    <section class="panel browser" aria-labelledby="browseHeading">
      <div class="browserHead">
        <div><h2 id="browseHeading">Recording browser</h2><p>Newest first.</p></div>
        <button id="refreshButton">Refresh</button>
      </div>
      <div id="recordings"><p class="empty">Loading recordings…</p></div>
    </section>
  </main>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
